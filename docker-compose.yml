services:
  postgres:
    image: postgres:16-alpine
    container_name: korean-vocab-postgres
    environment:
      POSTGRES_DB: korean_vocab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d korean_vocab"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: korean-vocab-backend
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: korean_vocab
      DB_USER: postgres
      DB_PASSWORD: postgres
      APP_ENV: docker
      APP_VERSION: v1.0.0
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000
    container_name: korean-vocab-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
